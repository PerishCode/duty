[package]
name = "duty-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Personal maintainer-duty command line automation."

[dependencies]
duty-core = { path = "../duty-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "duty"
path = "src/main.rs"

